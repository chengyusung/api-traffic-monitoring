name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - run: uvx ruff@0.17.3 check backend frontend
      - run: uvx ruff@0.17.3 format --check backend frontend

  frontend-test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      # Not in the frontend image by design, so they run on the runner.
      - name: Frontend unit tests
        run: cd frontend && uv sync --frozen && uv run python -m unittest

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create .env
        run: sed "s/^JWT_SECRET_KEY=.*/JWT_SECRET_KEY=$(openssl rand -hex 32)/" .env.example > .env
      - run: docker compose up --build -d
      - name: Wait for /health/ready
        run: |
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8000/health/ready && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - run: docker compose exec -T api pytest -q
      - if: always()
        run: docker compose down -v
