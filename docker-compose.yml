services:
  db:
    image: mariadb:11.7
    env_file: .env
    volumes:
      - db-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    env_file: .env
    # The demo seed and the import tests read data/sample_traffic.csv.
    volumes:
      - ./data:/app/data:ro
    # The writer's shutdown flush takes up to 10 s; the default grace period would SIGKILL it.
    stop_grace_period: 20s
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  frontend:
    build: ./frontend
    env_file: .env
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8501}:8501"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  db-data:
