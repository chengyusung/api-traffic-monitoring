[project]
name = "traffic-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.1",
    "argon2-cffi==25.1.0",
    "asyncmy==0.2.17",
    "fastapi==0.162.0",
    "openpyxl==3.1.5",
    "pydantic-settings==2.16.2",
    "pyjwt==2.15.1",
    "python-multipart==0.0.33",
    "sqlalchemy[asyncio]==2.1.6",
    "uvicorn==0.54.0",
    "websockets==17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "ruff==0.17.3",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]
