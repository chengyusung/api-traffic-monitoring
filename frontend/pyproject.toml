[project]
name = "traffic-frontend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests==2.34.2",
    "streamlit==1.66.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[dependency-groups]
dev = [
    "ruff==0.17.3",
]
